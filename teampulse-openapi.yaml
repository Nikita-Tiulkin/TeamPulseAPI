components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Cookie сессии. Имя cookie задаётся backend; здесь используется условное имя session.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Текст ошибки
        code:
          type: string
          example: validation_error
      required:
      - message
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        name:
          type: string
          example: Алексей Морозов
        initials:
          type: string
          example: АМ
        role:
          type: string
          enum:
          - admin
          - manager
          - employee
          example: manager
        roleLabel:
          type: string
          example: Руководитель
      required:
      - id
      - name
      - initials
      - role
      - roleLabel
    PeriodInfo:
      type: object
      properties:
        type:
          type: string
          enum:
          - day
          - week
          - month
          example: week
        label:
          type: string
          example: 7–13 октября
      required:
      - type
      - label
    Tone:
      type: string
      enum:
      - neutral
      - danger
      - warning
      - success
      - accent
      example: warning
    TeamColor:
      type: string
      enum:
      - violet
      - blue
      - pink
      - green
      example: blue
    Kpi:
      type: object
      properties:
        label:
          type: string
          example: В работе
        value:
          type: string
          example: '12'
        delta:
          type: string
          example: '+2'
        icon:
          type: string
          enum:
          - briefcase
          - check
          - alert
          - clock
          - person
          example: briefcase
        tone:
          type: string
          enum:
          - blue
          - green
          - red
          - orange
          - slate
          example: blue
        status:
          type: string
          example: В работе
      required:
      - label
      - value
      - delta
      - icon
      - tone
      - status
